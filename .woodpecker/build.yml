# 🔴 THIS WORKFLOW IS PULL-REQUEST ONLY (20-08-2026). It used to also run on
# push/main, where it was PURE WASTE — measured and removed.
#
# WHAT IT WAS. The build.yml -> push.yml split is a recorded owner decision
# (Infra/docs/plans/10-07-2026-woodpecker-ci-migration-design.md §10): under
# buildx, build.yml ran `dry_run: true` AND EXPORTED A REGISTRY CACHE, and
# push.yml then did a warm-cache assemble+push. The second build was nearly free
# by design, and the accepted cost was one extra clone, bought in exchange for a
# separate GitHub check per file.
#
# WHAT BROKE IT. The 27-07-2026 kaniko port dropped the cache and left the split
# standing. kaniko's plugin.sh sets `CACHE=""` whenever `dry-run: true`, so a
# dry-run build CANNOT warm anything — the main-branch build became a full
# rebuild of the identical Dockerfile whose output is thrown away, sitting on the
# critical path via push.yml's `depends_on`.
#
# MEASURED: 153s mean per affected pipeline across ten repos, 5.34 h/month,
# 12.3% of ALL CI wall-clock. Here: build 40s + push 45s.
# Proven on website-backend #54 first: 190s -> 105s, -45%.
#
# ⚠️ THE PR GATE IS THE POINT AND IT STAYS. `build-pr` still validates the
# Dockerfile on every pull request, with NO registry credentials, so a broken
# Dockerfile is caught before merge — which is where it should be caught. What
# was deleted is only the re-validation of an already-validated Dockerfile on
# the way to a build that happens seconds later anyway.
# See Infra/docs/audits/20-08-2026-ci-latency-audit.md §5.1.
# Build validation. Runs on every push to main and on every PR.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY KANIKO AND NOT plugin-docker-buildx (changed 27-07-2026)
#   CI is moving off the `ci-ops` VM and into the SKS cluster, which means the
#   agent runs Woodpecker's KUBERNETES backend and every step is a pod.
#
#   buildx needs a PRIVILEGED container. On Nomad that privilege was granted
#   SERVER-side by WOODPECKER_PLUGINS_PRIVILEGED, pinned to one exact image tag,
#   specifically so no repo committer could self-elevate by writing
#   `privileged: true` in their own pipeline.
#
#   ⚠️ WOODPECKER_PLUGINS_PRIVILEGED HAS NO EFFECT ON THE KUBERNETES BACKEND
#   (upstream woodpecker-ci/woodpecker#6484, open). The only way to get a
#   privileged step pod there is to mark the repo Trusted AND write
#   `privileged: true` in the step — precisely the path that design refuses.
#
#   kaniko builds ROOTLESS, so no step needs privilege at all. That is why build
#   pods can share the production node pool instead of needing an isolated one.
# ─────────────────────────────────────────────────────────────────────────────

# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so an agent is only eligible if the task
# asks for it. Remove this line and the workflow falls back to the ci-ops Docker
# agent; that is the rollback, and it is one line.
labels:
  runner: k8s

when:
  - event: pull_request

# 🔴 TWO STEPS, NOT ONE — and the split is a security boundary, not style.
#   The org secrets `registry_username` / `registry_password` are scoped to the
#   `push` and `tag` events ONLY, so that a pull request — which can come from a
#   branch anyone with write access authored — never has registry credentials in
#   its environment. Collapsing these into a single credentialed step makes the
#   server refuse the pipeline outright:
#     secret "registry_username" is not allowed to be used with pipeline event "pull_request"
#   which is the guard working. Keep the PR variant credential-free.
#   (Both are dry runs; nothing is pushed here. push.yml does the real push.)
steps:
  build-pr:
    image: woodpeckerci/plugin-kaniko:2.3.2@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 2Gi, cpu: 1 }
          limits: { memory: 6Gi }
    settings:
      dry-run: true
      # No `registry:`/`username:`/`password:` on purpose — see the block above.
      # The Dockerfile's base images come from Docker Hub, so an unauthenticated
      # dry run still proves the build compiles.
      repo: ciphera-net/sigil
      tags:
        - sha-${CI_COMMIT_SHA:0:7}
    when:
      - event: pull_request
