# Magic-Containers-only deploy. Sigil does NOT run in the cluster.
#
# ═══ THE CLUSTER DEPLOY WAS REMOVED 15-08-2026 ═══
# `deploy-k8s` is gone, and so is the Deployment it targeted: sigil now exists ONLY as
# the Bunny Magic Containers app AvPpL5TEK3F07Kw behind icons.ciphera.net, across 42
# regions. Plan: Infra/docs/plans/15-08-2026-mc-decommission-in-cluster-copies.md.
#
# That makes `bunny-push` below the ONE path by which a merge reaches production. There
# is no second copy, no fallback resolver, and nothing that repairs a missed push — a
# failed deploy leaves Magic Containers on the previous image. Treat that step's guards
# and its re-GET verification as load-bearing rather than defensive clutter.
#
# ⚠️ ORDER MATTERED WHEN THIS LANDED, and it is worth recording because the reverse
# would have been a silent production rollback. Until 15-08 the MC app was kept current
# by the in-cluster `mc-image-sync` CronJob, which reconciles MC *towards* the
# in-cluster Deployment's digest. Removing `deploy-k8s` while that Deployment still
# existed would have left the cluster copy STALE — and the CronJob would then have read
# MC as "drifted ahead" and PATCHed production BACK to the older image. The CronJob was
# therefore suspended BEFORE this step was removed, and the Deployment deleted straight
# after. Deleting the Deployment is itself safe (the job fails closed on
# `bad live digest []`); leaving it behind, stale, is the dangerous state.
#
# The deploy-nomad step was REMOVED 25-07-2026, ending the Phase-2 parallel run for
# this service. It had to go before the Nomad job was stopped: a stopped-but-unpurged
# job still answers GET /v1/job/<id>, so the next deploy would have re-registered and
# resurrected it.
#
# NO purge-cdn STEP. This used to be justified by "sigil has no Bunny pull zone and no
# public hostname", which is NO LONGER TRUE — it has zone 6332045 and serves
# icons.ciphera.net. The step is still correct to omit, for a different reason: an MC
# rollout is PROGRESSIVE (~10 min for 42 regions), so a purge fired at the end of this
# pipeline lands before convergence and simply re-caches the old build. Measured
# 15-08-2026; the same purge was tried inside mc-image-sync and removed for this reason.
#
# NEVER use the dollar-brace variable form anywhere in this file — not in a command,
# not in a comment. Woodpecker substitutes over the RAW FILE, comments included,
# BEFORE the YAML is parsed. A shell flag written that way with a default became a
# literal and turned a wedged rollout green (help pipeline 37); writing the form
# inside a warning comment made the compiler reject the file outright (help pipelines
# 38-40). Plain $VAR passes through untouched. CI_COMMIT_SHA below is the one
# deliberate exception — that substring expansion is Woodpecker's own, by design.
#
# Secrets mount as a DIRECTORY (/opt/woodpecker/secrets), never as individual files.
# token-sync publishes atomically (write .tmp, then mv); a rename swaps the inode, and
# a single-FILE bind mount stays pinned to the inode that existed when the container
# started — so a file mount can never observe a refreshed token. The previous version
# of this file mounted /opt/woodpecker/secrets/nomad-token directly, which worked only
# because the Nomad token is long-lived. The kube token is not (30m TTL).

# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so the agent is only eligible when a task
# asks for it. Deleting this line sends the workflow back to the ci-ops Docker
# agent; that is the rollback, and it is one line.
labels:
  runner: k8s

depends_on:
  - push

when:
  - event: push
    branch: main

steps:
  # Resolve the immutable digest once, and hand it to bunny-push. It used to feed TWO
  # targets (the cluster Deployment and Magic Containers) so the copies could not drift;
  # since 15-08-2026 there is only one target, but resolving the digest rather than
  # trusting the tag still matters — the copy to registry.bunny.net is done BY DIGEST,
  # which is what makes MC's imageDigest comparable to what this pipeline built.
  # ⚠️ The Accept list MUST include application/vnd.oci.image.manifest.v1+json.
  # kaniko INHERITS THE BASE IMAGE'S manifest media type, so the same plugin
  # emits a Docker v2 manifest for a `FROM scratch` image and an OCI image
  # manifest for an OCI base — i.e. the format varies per REPO, not per tool.
  # With an incomplete Accept the registry does not merely 404: it can fall
  # back to the legacy schema1 (`manifest.v1+prettyjws`) and return a DIFFERENT
  # DIGEST for the same tag. Measured 27-07-2026: sigil sha-fb167fc resolved to
  # ...39225e38 with the full list and ...0f8784ac with a partial one. Pinning a
  # Deployment to that second value would ship something that is not the image
  # that was built, and every gate downstream would still read green.
  digest:
    image: alpine:3.20
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    # registry.ops.ciphera.net resolves to the cluster's own NLB. A pod dialling
    # its own cluster's public load balancer hits the Exoscale NLB hairpin, and
    # ~1/node_count of those connections are black-holed. Pin the name at
    # Traefik's ClusterIP so the request never leaves the cluster.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache curl jq >/dev/null
      - export DEPLOY_SHA=${CI_COMMIT_SHA:0:7}
      - |
        DIGEST=$(curl -sfI --max-time 60 -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
          -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
          "https://registry.ops.ciphera.net/v2/ciphera-net/sigil/manifests/sha-$DEPLOY_SHA" \
          | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "digest resolution failed for sha-$DEPLOY_SHA (got [$DIGEST]) — did push finish?"; exit 1 ;;
        esac
        echo "$DIGEST"     > /woodpecker/digest
        echo "$DEPLOY_SHA" > /woodpecker/deploy_sha
      - echo "resolved sha-$DEPLOY_SHA -> $(cat /woodpecker/digest)"

  # ═══ THE MAGIC CONTAINERS DEPLOY PATH ═══
  # icons.ciphera.net is served by the Bunny Magic Containers app AvPpL5TEK3F07Kw,
  # NOT by the cluster. This is THE deploy path — the only way a merge to main reaches
  # production. Until 15-08-2026 the gap was closed in-cluster by the `mc-image-sync`
  # CronJob, which read the digest off the in-cluster Deployment and mirrored it; that
  # job and that Deployment are both retired
  # (Infra/docs/plans/15-08-2026-mc-decommission-in-cluster-copies.md).
  #
  # WHY THE BUNNY ACCOUNT KEY IS IN CI, when mc-image-sync's whole rationale was to
  # keep it out: it was ALREADY here. `bunny_api_key` has been an ORG-LEVEL Woodpecker
  # secret (org 2, events push+tag) readable by every repo's push pipelines, because
  # CDN purging needs it. Refusing this step the credential while every neighbouring
  # pipeline already holds it bought nothing. Owner decision 15-08-2026; the trade-off
  # is written down in the plan above rather than left implied.
  #
  # ⚠️ The Bunny Container Registry has no scoped token — the registry credential IS
  # the full-access account key (it can delete pull zones, change DNS and read every
  # storage password). Nothing below may put it in argv or in a file that outlives the
  # step.
  bunny-push:
    image: alpine:3.20
    # The `deploy-k8s` dependency this carried until 15-08-2026 is gone with the step
    # itself. It existed to stop `mc-image-sync` racing this one; both are retired, and
    # this step never read the cluster in the first place.
    depends_on: [digest]
    backend_options:
      kubernetes:
        resources:
          # Larger than the other alpine steps: skopeo streams the whole image through
          # this pod. BestEffort here means an eviction mid-copy, which presents as a
          # registry error rather than as what it is.
          requests: { memory: 512Mi, cpu: 250m }
          limits: { memory: 1Gi }
    # Same NLB-hairpin pin as every other step that touches this registry — skopeo
    # PULLS from registry.ops here, so it is subject to the identical black-holing.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    environment:
      MC_APP_ID: AvPpL5TEK3F07Kw
      MC_HOSTNAME: icons.ciphera.net
      BUNNY_ACCOUNT: 90d844eb-838c-4c74-9c7a-c537bde7f3a2
      BUNNY_REPO: sigil
      OPS_IMAGE: registry.ops.ciphera.net/ciphera-net/sigil
      # Rebuilt into the PATCH body in the WRITE shape. Sigil's health endpoint is on
      # its own port, not the HTTP port — a frontend's is not the same, so this is per
      # app rather than a shared default.
      PROBE_PATH: /healthz
      PROBE_PORT: "8085"
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
      BUNNY_API_KEY:
        from_secret: bunny_api_key
    commands:
      # skopeo is in Alpine's community repo, which is the reason to use it: no NEW
      # vendor image enters the estate (every prebuilt skopeo/crane image is hosted by
      # a US company). Installed before anything else so a failure here cannot be
      # mistaken for a registry problem.
      - apk add --no-cache skopeo curl jq >/dev/null || { echo "apk add failed"; exit 1; }
      - |
        DIGEST=$(cat /woodpecker/digest) || { echo "digest handoff missing"; exit 1; }
        DEPLOY_SHA=$(cat /woodpecker/deploy_sha) || { echo "deploy_sha handoff missing"; exit 1; }
        case "$DIGEST" in sha256:*) ;; *) echo "bad digest handoff [$DIGEST]"; exit 1 ;; esac
        [ -n "$DEPLOY_SHA" ] || { echo "empty deploy_sha handoff"; exit 1; }
        export DIGEST DEPLOY_SHA
        echo "TAG=sha-$DEPLOY_SHA  DIGEST=$DIGEST"
      # ═══ AUTHFILE ═══
      # 🔴 registry.bunny.net requires the base64 `auth` FORM. A {username, password}
      # entry is REJECTED as `unauthorized` — proven 13-08-2026 — and the failure looks
      # exactly like a wrong credential, so it misdiagnoses as a bad key.
      # 🔴 Built with jq `env.X`, NOT `--arg`: --arg would put the base64 credential in
      # this process's argv, readable from /proc by anything sharing the pod. Same
      # reason skopeo is never given --src-creds/--dest-creds.
      # Written to /tmp (step-local), never /woodpecker (the shared workflow volume,
      # which outlives this step and is visible to every other step).
      - |
        mkdir -p /tmp/regauth && chmod 700 /tmp/regauth
        OPSAUTH=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
        BAUTH=$(printf 'token:%s' "$BUNNY_API_KEY" | base64 | tr -d '\n')
        export OPSAUTH BAUTH
        jq -n '{auths: {"registry.ops.ciphera.net": {auth: env.OPSAUTH},
                        "registry.bunny.net":       {auth: env.BAUTH}}}' \
          > /tmp/regauth/auth.json || { echo "FAIL: building authfile"; exit 1; }
        chmod 600 /tmp/regauth/auth.json
        unset OPSAUTH BAUTH
      # Copy BY DIGEST, tag by commit. Pulling @sha256 rather than :sha-xxx is what
      # makes the two registries provably hold the same bytes — which is in turn what
      # lets the verification below compare MC's imageDigest against the digest this
      # pipeline resolved.
      #
      # ⚠️ THE OUTER RETRY LOOP IS NOT BELT-AND-BRACES — `--retry-times` DOES NOT COVER
      # THIS. MEASURED 15-08-2026, sigil pipeline 38: the Bunny registry returned
      #   500 Internal Server Error
      # on a blob upload (PUT .../blobs/uploads/<uuid>?digest=sha256:...) and skopeo
      # exited `fatal` immediately, with --retry-times 3 already set. A plain restart of
      # the same pipeline then succeeded, so the 500 is transient upstream flakiness
      # rather than anything about this image. Logged in Infra/docs/bunny-beta-feedback.md.
      #
      # That matters more than a normal flake because this step is the ONLY path by
      # which a merge reaches production — a failure here does not fall back to
      # anything, it just leaves Magic Containers on the previous image.
      #
      # Retrying is SAFE to do blindly: the copy is idempotent (same digest, same tag)
      # and it happens BEFORE any mutation of the MC app, so every failure in this
      # phase is a no-op against production.
      - |
        COPIED=no
        for attempt in 1 2 3 4 5; do
          if skopeo copy --authfile /tmp/regauth/auth.json --retry-times 3 \
               "docker://$OPS_IMAGE@$DIGEST" \
               "docker://registry.bunny.net/$BUNNY_ACCOUNT/$BUNNY_REPO:sha-$DEPLOY_SHA"; then
            COPIED=yes; break
          fi
          echo "skopeo copy attempt $attempt failed — retrying in $((attempt * 10))s"
          sleep $((attempt * 10))
        done
        # A `for` loop that ends without breaking exits 0, so THIS check is what fails
        # the step — same shape as the rollout gate above, for the same reason.
        [ "$COPIED" = "yes" ] \
          || { echo "FAIL: skopeo copy to registry.bunny.net after 5 attempts"; exit 1; }
      # ═══ RECORD WHAT WE ARE NOT SENDING, BEFORE WE SEND ═══
      # The PATCH replaces the template, so the only way to prove it did not silently
      # drop something is to know what was there first.
      #   endpoints[].id + pullZoneId — losing these is DESTRUCTIVE, not merely wrong:
      #     the pull zone goes with the endpoint and the hostname goes with the zone.
      #   packageId — the container SIZE, and 🔴 the patch body DOES NOT SEND IT.
      #     It is omitted because this body is the shape proven in production by
      #     mc-image-sync, and adding an unproven field to a REPLACE is the larger
      #     risk. Whether Bunny preserves an omitted packageId is UNVERIFIED — both MC
      #     apps carry the same id, so their agreement proves nothing. So it is
      #     asserted instead of assumed: if a REPLACE ever silently resizes the app,
      #     this deploy fails loudly rather than quietly shrinking production.
      - |
        CUR=$(curl -sf --max-time 20 -H "AccessKey: $BUNNY_API_KEY" \
              "https://api.bunny.net/mc/apps/$MC_APP_ID") \
          || { echo "FAIL: could not read MC app $MC_APP_ID"; exit 1; }
        echo "$CUR" > /tmp/mc-before.json
        jq -c '{packageId: .containerTemplates[0].packageId,
                endpoints: ([.containerTemplates[0].endpoints[] | {id, pullZoneId}] | sort_by(.id))}' \
          /tmp/mc-before.json > /tmp/mc-invariants.json
        echo "invariants before: $(cat /tmp/mc-invariants.json)"
        [ "$(jq '.endpoints | length' /tmp/mc-invariants.json)" -ge 1 ] \
          || { echo "FAIL: MC app already has no endpoints — refusing to touch it"; exit 1; }
      # ═══ 🔴🔴 THE PATCH BODY IS LOAD-BEARING AND A NAIVE ONE IS DESTRUCTIVE ═══
      # PATCH /mc/apps/{id} REPLACES containerTemplates — it does not merge. A body of
      # {name, imageTag} returns 200 and wipes environmentVariables, probes AND
      # endpoints; destroying the endpoint DELETES ITS PULL ZONE and takes the hostname
      # down. That is exactly how icons.ciphera.net went down on 13-08-2026.
      # Three properties make it an update instead:
      #   * the FULL template (registry/namespace/name/tag/pullPolicy, env, probes,
      #     endpoints) — a partial body is destructive, not rejected;
      #   * endpoints in the WRITE shape (cdn:{portMappings}), NOT the READ shape the
      #     GET returns (type/publicHost/pullZoneId);
      #   * each endpoint's EXISTING `id`. Without it Bunny creates a new pull zone and
      #     destroys the old one, hostname and certificate with it.
      - |
        jq --arg tag "sha-$DEPLOY_SHA" --arg pp "$PROBE_PATH" --argjson pn "$PROBE_PORT" '
          .containerTemplates[0] as $t
          | {containerTemplates: [{
              id: $t.id, name: $t.name,
              imageRegistryId: $t.imageRegistryId,
              imageNamespace:  $t.imageNamespace,
              imageName:       $t.imageName,
              imageTag:        $tag,
              imagePullPolicy: "Always",
              environmentVariables: $t.environmentVariables,
              probes: {
                liveness:  {httpGet:{request:{path:$pp,portNumber:$pn}}},
                readiness: {httpGet:{request:{path:$pp,portNumber:$pn}}}
              },
              endpoints: [ $t.endpoints[] | {
                id: .id, displayName: .displayName,
                cdn: {portMappings: [ .portMappings[] | {containerPort: .containerPort, port: 80} ]}
              }]
            }]}' /tmp/mc-before.json > /tmp/mc-patch.json \
          || { echo "FAIL: building patch body"; exit 1; }
        # Belt and braces against the exact 13-08 failure: never send a body that would
        # drop the endpoint, whatever produced it.
        EPC=$(jq '.containerTemplates[0].endpoints | length' /tmp/mc-patch.json)
        [ "$EPC" -ge 1 ] || { echo "FAIL: patch body has no endpoints, refusing to send"; exit 1; }
        NOID=$(jq '[.containerTemplates[0].endpoints[] | select(.id == null)] | length' /tmp/mc-patch.json)
        [ "$NOID" = "0" ] \
          || { echo "FAIL: $NOID endpoint(s) in the patch body have no id — sending this would MINT A NEW PULL ZONE and destroy $MC_HOSTNAME"; exit 1; }
        echo "patch body: $EPC endpoint(s), all with ids, tag sha-$DEPLOY_SHA"
      - |
        curl -sf --max-time 30 -X PATCH -H "AccessKey: $BUNNY_API_KEY" \
          -H 'Content-Type: application/json' -d @/tmp/mc-patch.json \
          "https://api.bunny.net/mc/apps/$MC_APP_ID" >/dev/null \
          || { echo "FAIL: PATCH /mc/apps/$MC_APP_ID"; exit 1; }
      # ═══ 🔴 RE-GET. A 2xx IS NOT PROOF ═══
      # This API silently discards fields it does not like, so success is defined as
      # BOTH: the digest we shipped is live, AND everything we did NOT send is still
      # there — same endpoint ids, same pull zone, same package. Checking imageDigest
      # alone would report green on the change that took the hostname down on 13-08.
      # Polled rather than slept: MC accepts the PATCH and reflects the new digest
      # asynchronously, so a fixed sleep is either flaky or wasteful.
      - |
        OK=no; A_DIG=""; A_INV=""
        WANT=$(cat /tmp/mc-invariants.json)
        for i in $(seq 1 20); do
          A=$(curl -sf --max-time 20 -H "AccessKey: $BUNNY_API_KEY" \
              "https://api.bunny.net/mc/apps/$MC_APP_ID") \
            || { echo "re-read failed (iter $i) — retrying"; sleep 5; continue; }
          A_DIG=$(echo "$A" | jq -r '.containerTemplates[0].imageDigest')
          A_INV=$(echo "$A" | jq -c '{packageId: .containerTemplates[0].packageId,
                                      endpoints: ([.containerTemplates[0].endpoints[] | {id, pullZoneId}] | sort_by(.id))}')
          if [ "$A_DIG" = "$DIGEST" ] && [ "$A_INV" = "$WANT" ]; then
            OK=yes; echo "MC now runs $A_DIG; invariants intact: $A_INV"; break
          fi
          sleep 5
        done
        if [ "$OK" != "yes" ]; then
          echo "--- expected digest: $DIGEST"
          echo "--- actual digest:   $A_DIG"
          echo "--- invariants before: $WANT"
          echo "--- invariants after:  $A_INV"
          if [ "$A_INV" != "$WANT" ]; then
            echo "🔴 THE PATCH CHANGED SOMETHING IT DID NOT SEND."
            echo "🔴 If endpoints or pullZoneId moved, $MC_HOSTNAME MAY BE DOWN and its pull zone may be GONE."
            echo "🔴 Restore per Infra/MagicContainers/sigil/README.md; verify the pull zone still exists before re-running."
          fi
          echo "FAIL: MC did not converge on the shipped image with its configuration intact"
          exit 1
        fi
      # A rollout across 42 regions is PROGRESSIVE — roughly 10 minutes, measured
      # 15-08-2026. This step returning green means MC is CONFIGURED to run the new
      # image, not that every region already serves it. There is deliberately no purge
      # here: a purge fired now lands before convergence and simply re-caches the old
      # build (measured — see mc-image-sync's manifest for the full reasoning).
      - echo "Magic Containers app $MC_APP_ID set to sha-$DEPLOY_SHA ($MC_HOSTNAME) — rollout across 42 regions takes ~10 min"
