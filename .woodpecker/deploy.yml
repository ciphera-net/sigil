# Cluster-only deploy: SKS. Originally generated from
# Infra/Kubernetes/workloads/_shared/ci-deploy/deploy.yml.template with
# JOB=sigil  REPO=ciphera-net/sigil  CONTAINER=server.
#
# The deploy-nomad step was REMOVED 25-07-2026, ending the Phase-2 parallel run for
# this service. It had to go before the Nomad job was stopped: a stopped-but-unpurged
# job still answers GET /v1/job/<id>, so the next deploy would have re-registered and
# resurrected it.
#
# For sigil that step was the LIVE path, not a rollback path, because
# pulse-frontend-staging called the VM copy at http://10.10.0.20:8085/icon over the
# privnet. That is no longer true: FAVICON_UPSTREAM_URL now points at
# http://sigil.apps.svc.cluster.local/icon, verified end to end through the public
# staging edge before this step was removed (real image/png bodies, byte-identical to
# the VM copy). That flip is what unblocked this removal.
#
# NO purge-cdn STEP, and that is correct rather than an omission: sigil has no Bunny
# pull zone and no public hostname. It is reached only in-cluster, at
# http://sigil.apps.svc.cluster.local — publishing an SSRF-guarded fetcher is
# deliberately not done. See Infra/Kubernetes/workloads/sigil/sigil.yaml.
#
# NEVER use the dollar-brace variable form anywhere in this file — not in a command,
# not in a comment. Woodpecker substitutes over the RAW FILE, comments included,
# BEFORE the YAML is parsed. A shell flag written that way with a default became a
# literal and turned a wedged rollout green (help pipeline 37); writing the form
# inside a warning comment made the compiler reject the file outright (help pipelines
# 38-40). Plain $VAR passes through untouched. CI_COMMIT_SHA below is the one
# deliberate exception — that substring expansion is Woodpecker's own, by design.
#
# Secrets mount as a DIRECTORY (/opt/woodpecker/secrets), never as individual files.
# token-sync publishes atomically (write .tmp, then mv); a rename swaps the inode, and
# a single-FILE bind mount stays pinned to the inode that existed when the container
# started — so a file mount can never observe a refreshed token. The previous version
# of this file mounted /opt/woodpecker/secrets/nomad-token directly, which worked only
# because the Nomad token is long-lived. The kube token is not (30m TTL).

# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so the agent is only eligible when a task
# asks for it. Deleting this line sends the workflow back to the ci-ops Docker
# agent; that is the rollback, and it is one line.
labels:
  runner: k8s

depends_on:
  - push

when:
  - event: push
    branch: main

steps:
  # Resolve the immutable digest ONCE and hand the same value to both targets, so the
  # two copies can never drift apart.
  digest:
    image: alpine:3.20
    # registry.ops.ciphera.net resolves to the cluster's own NLB. A pod dialling
    # its own cluster's public load balancer hits the Exoscale NLB hairpin, and
    # ~1/node_count of those connections are black-holed. Pin the name at
    # Traefik's ClusterIP so the request never leaves the cluster.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache curl jq >/dev/null
      - export DEPLOY_SHA=${CI_COMMIT_SHA:0:7}
      - |
        DIGEST=$(curl -sfI --max-time 60 -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
          -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
          "https://registry.ops.ciphera.net/v2/ciphera-net/sigil/manifests/sha-$DEPLOY_SHA" \
          | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "digest resolution failed for sha-$DEPLOY_SHA (got [$DIGEST]) — did push finish?"; exit 1 ;;
        esac
        echo "$DIGEST"     > /woodpecker/digest
        echo "$DEPLOY_SHA" > /woodpecker/deploy_sha
      - echo "resolved sha-$DEPLOY_SHA -> $(cat /woodpecker/digest)"

  deploy-k8s:
    image: alpine:3.20
    depends_on: [digest]
    # NO volume, deliberately — this is the whole point of running in-cluster.
    #
    # On ci-ops this step bind-mounted /opt/woodpecker/secrets:/run/ci:ro, a host
    # directory into which the agent's `token-sync` task republished a 30-minute
    # Vault-issued ServiceAccount token plus the SKS control-plane CA every 30s.
    # All of that existed only because CI ran OUTSIDE the cluster and had no
    # Kubernetes identity of its own.
    #
    # A step pod has one automatically: the kubelet projects a rotating token and
    # the API server's CA at /var/run/secrets/kubernetes.io/serviceaccount/, and
    # the API is reachable in-cluster at kubernetes.default.svc. So the token-sync
    # mechanism, the host mount and the Vault round trip all disappear, and the
    # credential is now bound to this pod instead of readable by anything sharing
    # a VM. Permissions come from the ci-deployer RoleBinding
    # (Infra/Kubernetes/workloads/_shared/ci-deployer.yaml), which binds
    # woodpecker-builds/default.
    environment:
      KUBE_API: https://kubernetes.default.svc
    commands:
      - apk add --no-cache curl jq >/dev/null
      # Validated cross-step handoff. `export X=$(cat missing)` does NOT abort under
      # errexit (export is a builtin and the list takes the builtin's status), so it
      # silently yields empty and would PATCH `ciphera-net/sigil@` into the live
      # Deployment. The apiserver does not validate image-reference syntax, so that is
      # accepted and the pod then fails InvalidImageName with the old pod still serving.
      - |
        DIGEST=$(cat /woodpecker/digest) || { echo "digest handoff missing"; exit 1; }
        DEPLOY_SHA=$(cat /woodpecker/deploy_sha) || { echo "deploy_sha handoff missing"; exit 1; }
        case "$DIGEST" in sha256:*) ;; *) echo "bad digest handoff [$DIGEST]"; exit 1 ;; esac
        [ -n "$DEPLOY_SHA" ] || { echo "empty deploy_sha handoff"; exit 1; }
        export DIGEST DEPLOY_SHA
      # Strategic-merge PATCH of image + deploy-sha annotation (the analogue of Nomad's
      # .Meta.deploy_sha). fieldManager is set so a later `apply --server-side` reports
      # an honest conflict on the image field instead of silently winning.
      - |
        BODY=$(jq -nc \
          --arg img "registry.ops.ciphera.net/ciphera-net/sigil@$DIGEST" \
          --arg sha "$DEPLOY_SHA" \
          '{spec:{template:{metadata:{annotations:{"ciphera.net/deploy-sha":$sha}},
                            spec:{containers:[{name:"server",image:$img}]}}}}')
        curl -fsS --max-time 30 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -X PATCH \
          -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          -H "Content-Type: application/strategic-merge-patch+json" \
          -d "$BODY" \
          "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/sigil?fieldManager=woodpecker-ci" >/dev/null
      # Convergence gate. All four clauses are load-bearing; see the shared README.
      # status.replicas == updatedReplicas is the one that stops the gate passing while
      # an OLD pod is still serving. The token is re-read every iteration — it is
      # non-renewable with a 30m TTL and this loop may run several minutes.
      - |
        CONVERGED=no
        for i in $(seq 1 90); do
          S=$(curl -fsS --max-time 15 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/sigil") \
            || { echo "api read failed (iter $i) — retrying"; S=''; }
          echo "$S" | jq -e '
            ((.status.observedGeneration // 0) >= .metadata.generation)
            and ((.status.updatedReplicas // 0) == .spec.replicas)
            and ((.status.replicas // 0) == (.status.updatedReplicas // 0))
            and ((.status.availableReplicas // 0) == (.status.updatedReplicas // 0))' >/dev/null \
            && { echo "k8s rollout converged"; CONVERGED=yes; break; }
          echo "$S" | jq -e '.status.conditions[]? | select(.type=="Progressing" and .reason=="ProgressDeadlineExceeded")' >/dev/null \
            && { echo "k8s rollout FAILED (ProgressDeadlineExceeded)"; break; }
          sleep 4
        done
        # A for loop that ends without breaking exits 0, so THIS post-loop check is what
        # actually fails the step. It must not depend on any flag Woodpecker could have
        # substituted away.
        if [ "$CONVERGED" != "yes" ]; then
          echo "--- pods in apps ---"
          curl -fsS --max-time 15 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "$KUBE_API/api/v1/namespaces/apps/pods" \
            | jq -r '.items[] | select(.metadata.name | startswith("sigil")) | "\(.metadata.name) \(.status.phase) \([.status.containerStatuses[]?.state | keys[0]] | join(","))"' || true
          echo "k8s rollout did NOT converge for sigil"
          exit 1
        fi
      # Assert what is ACTUALLY running. Catches two things the gate structurally
      # cannot: a wrong container name (strategic-merge keys containers on `name`, so
      # it would return 200 and ADD a second container rather than fail), and a
      # concurrent manifest apply that reverts the image while leaving the annotation
      # still claiming this commit.
      - |
        O=$(curl -fsS --max-time 15 --retry 3 --retry-all-errors --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
          -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/sigil")
        echo "$O" | jq -e \
          --arg img "registry.ops.ciphera.net/ciphera-net/sigil@$DIGEST" \
          --arg sha "$DEPLOY_SHA" '
          ([.spec.template.spec.containers[].name] == ["server"])
          and ((.spec.template.spec.containers[] | select(.name=="server") | .image) == $img)
          and (.spec.template.metadata.annotations["ciphera.net/deploy-sha"] == $sha)' >/dev/null \
          || { echo "POST-DEPLOY MISMATCH — running spec is not what we shipped:"; \
               echo "$O" | jq '{containers:[.spec.template.spec.containers[]|{name,image}], sha:.spec.template.metadata.annotations["ciphera.net/deploy-sha"]}'; exit 1; }
      - echo "Deployed sigil to SKS ($DEPLOY_SHA)"
