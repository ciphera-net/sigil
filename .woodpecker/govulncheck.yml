# Routes to the in-cluster Kubernetes agent (`!runner=k8s` is a MANDATORY
# label there). No extra_hosts needed — this workflow never talks to the
# registry, so it does not cross the NLB.
labels:
  runner: k8s

when:
  - event: push
    branch: main
  - event: pull_request

steps:
  govulncheck:
    image: registry.ops.ciphera.net/mirror/docker.io/library/golang:1.26-6327cb290853@sha256:6327cb290853a5d13091c436b88259b4f35ff70e49b1f8d9e5d1dd1757e9c6ba
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 1Gi, cpu: 500m }
          limits: { memory: 3Gi }
    commands:
      # Pinned, and bumped on purpose: an unpinned `@latest` broke this step when x/vuln v1.8.0
      # raised its floor to Go 1.26 (the golang images set GOTOOLCHAIN=local).
      - go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - govulncheck ./...
