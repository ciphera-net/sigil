# Routes to the in-cluster Kubernetes agent (`!runner=k8s` is a MANDATORY
# label there). No extra_hosts needed — this workflow never talks to the
# registry, so it does not cross the NLB.
labels:
  runner: k8s

when:
  - event: push
    branch: main
  - event: pull_request

steps:
  govulncheck:
    image: golang:1.25
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 1Gi, cpu: 500m }
          limits: { memory: 3Gi }
    commands:
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - govulncheck ./...
