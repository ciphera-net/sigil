# Build and PUSH the image. Only on push to main, after build.yml passes.
# See .woodpecker/build.yml for why this is kaniko and not buildx.

labels:
  runner: k8s

# `depends_on: [build]` REMOVED 20-08-2026 (build.yml is pull-request only now).
# On a push there is no `build` workflow to wait for, and what it used to wait
# for was a discarded rebuild of this very image. This step is now the FIRST and
# ONLY build on main, which is what makes the deletion safe: a Dockerfile
# that does not build still fails the pipeline here, before deploy.yml can ship.
# See Infra/docs/audits/20-08-2026-ci-latency-audit.md §5.1.

when:
  - event: push
    branch: main

steps:
  push:
    image: woodpeckerci/plugin-kaniko:2.3.2@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 2Gi, cpu: 1 }
          limits: { memory: 6Gi }
    # 🔴 REQUIRED, and it is why this repo carries `trusted.network`.
    #   registry.ops.ciphera.net resolves to the cluster's own NLB
    #   (159.100.249.253). A pod dialling its own cluster's public load balancer
    #   hits the Exoscale NLB hairpin: connections the NLB returns to the
    #   ORIGINATING node are black-holed, so ~1/node_count of pushes die with
    #     dial tcp 159.100.249.253:443: i/o timeout
    #   Measured on the proof repo 27-07-2026 — one push succeeded, the next
    #   timed out on exactly this. Pointing the name at Traefik's ClusterIP skips
    #   the NLB entirely. Identical fix and reasoning to cert-manager's
    #   hostAliases (Infra/Kubernetes/addons/30-cert-manager/values.yaml).
    #
    # ⚠️ 10.101.182.27 is a ClusterIP — NOT reachable from the ci-ops VM. That is
    #   the other reason `labels: {runner: k8s}` above is load-bearing: this
    #   workflow must never run on the Docker agent.
    # ⚠️ The IP is pinned at service.spec.clusterIP in addons/20-traefik/values.yaml
    #   precisely so a Traefik reinstall cannot move it out from under this.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    settings:
      registry: registry.ops.ciphera.net
      repo: ciphera-net/sigil          # NO hostname — see build.yml
      tags:
        - sha-${CI_COMMIT_SHA:0:7}
        - latest
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      # NOTE: no build cache yet, deliberately. buildx used a registry cache
      # (`cache_from`/`cache_to`); kaniko's equivalent is `cache: true` +
      # `cache-repo`, and it is NOT yet verified whether `cache-repo` also gets
      # `registry` prepended the way `repo` does. Getting that wrong silently
      # creates a junk repository in the registry, which is exactly the failure
      # this file's other comments exist to prevent. Correctness first; add the
      # cache once it is measured. Cost today is a slower build, not a wrong one.
